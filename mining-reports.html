<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mining Reports</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #0b0b12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 56px;
      background:
        radial-gradient(circle at 20% 0%, rgba(160, 110, 50, 0.18), transparent 45%),
        radial-gradient(circle at 80% 100%, rgba(40, 120, 120, 0.15), transparent 45%),
        #0b0b12;
    }
    h1 { font-size: 30px; font-weight: 300; letter-spacing: 1px; color: rgba(255, 255, 255, 0.9); text-align: center; }
    .sub { margin-top: 8px; font-size: 14px; color: rgba(255, 255, 255, 0.5); text-align: center; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
    .filters button {
      font: inherit; font-size: 13px; color: rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px; padding: 6px 14px; cursor: pointer;
    }
    .filters button.on { background: rgba(214, 160, 90, 0.25); border-color: rgba(214, 160, 90, 0.6); color: #fff; }

    .list { width: 100%; max-width: 820px; margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
    .panel {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px 18px;
      min-width: 0;
    }
    .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
    .kind { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; padding: 2px 8px; border-radius: 6px; }
    .kind.bug { background: rgba(90, 160, 230, 0.2); color: #9cc8f5; }
    .kind.crash { background: rgba(230, 90, 90, 0.2); color: #f5a0a0; }
    .kind.errors { background: rgba(214, 160, 90, 0.18); color: #e8c08a; }
    .kind.other { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.7); }
    .x {
      margin-left: auto; font: inherit; font-size: 18px; line-height: 1; color: rgba(255, 255, 255, 0.35);
      background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 6px;
    }
    .x:hover { color: #f5a0a0; background: rgba(230, 90, 90, 0.12); }
    .when { font-size: 15px; color: rgba(255, 255, 255, 0.9); }
    .meta { font-size: 12px; color: rgba(255, 255, 255, 0.45); }
    .id { font-family: ui-monospace, Consolas, monospace; }
    .bugtext {
      margin-top: 10px; padding: 10px 12px; border-left: 3px solid rgba(90, 160, 230, 0.6);
      background: rgba(90, 160, 230, 0.07); border-radius: 0 8px 8px 0;
      white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45;
    }
    .shot { display: block; margin-top: 10px; max-width: 100%; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
    details { margin-top: 10px; }
    summary { cursor: pointer; font-size: 13px; color: rgba(255, 255, 255, 0.6); }
    pre {
      margin-top: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5;
      color: rgba(255, 255, 255, 0.75); white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .files { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
    .files a { color: #e8c08a; text-decoration: none; }
    .files a:hover { text-decoration: underline; }
    .files .size { color: rgba(255, 255, 255, 0.35); }
    .filters button.clear { color: #f5a0a0; border-color: rgba(230, 90, 90, 0.35); background: rgba(230, 90, 90, 0.08); }
    .empty { text-align: center; color: rgba(255, 255, 255, 0.5); padding: 30px 0; }
  </style>
</head>
<body>
  <h1>Reports</h1>
  <div class="sub" id="summary">Loading&hellip;</div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>

  <script>
    var reports = [], filter = "all";

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function size(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
      return (n / 1024 / 1024).toFixed(1) + " MB";
    }
    function when(iso) {
      var d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    function fileUrl(r, name) {
      return "/mining-reports/file/" + encodeURIComponent(r.name) + "/" + name.split("/").map(encodeURIComponent).join("/");
    }

    function renderFilters() {
      var counts = { all: reports.length };
      reports.forEach(function(r) { counts[r.kind] = (counts[r.kind] || 0) + 1; });
      var box = document.getElementById("filters");
      box.textContent = "";
      Object.keys(counts).forEach(function(k) {
        var b = el("button", k === filter ? "on" : "", (k === "all" ? "All" : k[0].toUpperCase() + k.slice(1)) + " (" + counts[k] + ")");
        b.onclick = function() { filter = k; renderFilters(); renderList(); };
        box.appendChild(b);
      });
      if (reports.length) {
        var c = el("button", "clear", "Clear reports");
        c.onclick = clearReports;
        box.appendChild(c);
      }
    }

    function clearReports() {
      if (confirm("Delete all " + reports.length + " reports from the Pi? This can't be undone."))
        remove(reports.map(function(r) { return r.name; }));
    }

    function remove(names) {
      fetch(location.origin + "/mining-reports/clear", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Clear-Reports": "yes" },
        body: JSON.stringify({ names: names }),
      })
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(load)
        .catch(function() { alert("Couldn't delete the reports."); });
    }

    function renderList() {
      var list = document.getElementById("list");
      list.textContent = "";
      var shown = reports.filter(function(r) { return filter === "all" || r.kind === filter; });
      if (!shown.length) { list.appendChild(el("div", "empty", "No reports yet.")); return; }
      shown.forEach(function(r) {
        var p = el("div", "panel");
        var head = el("div", "head");
        head.appendChild(el("span", "kind " + (["bug", "crash", "errors"].indexOf(r.kind) >= 0 ? r.kind : "other"), r.kind));
        head.appendChild(el("span", "when", when(r.received)));
        var meta = el("span", "meta");
        meta.appendChild(el("span", "id", r.id));
        meta.appendChild(document.createTextNode("  ·  " + [r.build, r.platform, size(r.bytes)].filter(Boolean).join("  ·  ")));
        head.appendChild(meta);
        var x = el("button", "x", "×"); x.title = "Delete this report";
        x.onclick = function() {
          if (confirm("Delete this " + r.kind + " report (" + r.id + ")? This can't be undone.")) remove([r.name]);
        };
        head.appendChild(x);
        p.appendChild(head);

        if (r.bug != null) p.appendChild(el("div", "bugtext", r.bug.trim() || "(no text)"));
        var shot = r.files.find(function(f) { return /\.(jpe?g|png)$/i.test(f.name); });
        if (shot) {
          var a = el("a"); a.href = fileUrl(r, shot.name); a.target = "_blank";
          var img = el("img", "shot"); img.loading = "lazy"; img.src = a.href; img.alt = "Screenshot";
          a.appendChild(img); p.appendChild(a);
        }
        if (r.report) {
          var d = el("details");
          d.appendChild(el("summary", null, "Game and machine details"));
          d.appendChild(el("pre", null, r.report.trim()));
          p.appendChild(d);
        }
        if (r.error) p.appendChild(el("div", "meta", r.error));

        var files = el("div", "files");
        r.files.forEach(function(f) {
          var a = el("a", null, f.name); a.href = fileUrl(r, f.name); a.target = "_blank";
          files.appendChild(a);
          a.appendChild(el("span", "size", " " + size(f.size)));
        });
        var z = el("a", null, "Whole zip"); z.href = "/mining-reports/file/" + encodeURIComponent(r.name) + ".zip";
        files.appendChild(z);
        p.appendChild(files);
        list.appendChild(p);
      });
    }

    function load() {
      fetch(location.origin + "/mining-reports/list.json", { cache: "no-store" })
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data) {
        reports = data;
        if (!data.some(function(r) { return r.kind === filter; })) filter = "all";
        document.getElementById("summary").textContent = data.length + " report" + (data.length === 1 ? "" : "s") + ", newest first";
        renderFilters();
        renderList();
      })
      .catch(function() { document.getElementById("summary").textContent = "Couldn't load the reports."; });
    }
    load();
  </script>
</body>
</html>
