<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Another Mining Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #0b0b12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background:
        radial-gradient(circle at 20% 0%, rgba(160, 110, 50, 0.18), transparent 45%),
        radial-gradient(circle at 80% 100%, rgba(40, 120, 120, 0.15), transparent 45%),
        #0b0b12;
    }
    form {
      width: 100%;
      max-width: 340px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px 26px;
    }
    h1 { font-size: 24px; font-weight: 300; letter-spacing: 1px; color: rgba(255, 255, 255, 0.9); text-align: center; }
    .sub { margin: 8px 0 22px; font-size: 14px; color: rgba(255, 255, 255, 0.5); text-align: center; }
    input {
      width: 100%;
      font: inherit;
      font-size: 15px;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
      outline: none;
    }
    input:focus { border-color: rgba(214, 160, 90, 0.7); }
    button {
      width: 100%;
      margin-top: 12px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      background: rgba(214, 160, 90, 0.35);
      border: 1px solid rgba(214, 160, 90, 0.6);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
    }
    button:hover { background: rgba(214, 160, 90, 0.5); }
    .error {
      display: none;
      margin-bottom: 14px;
      padding: 10px 12px;
      font-size: 13px;
      color: #f5a0a0;
      background: rgba(230, 90, 90, 0.12);
      border: 1px solid rgba(230, 90, 90, 0.3);
      border-radius: 8px;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <form method="POST" action="/mining/login">
    <h1>Another Mining Game</h1>
    <div class="sub">Enter the password to continue</div>
    <div class="error" id="error"></div>
    <input type="hidden" name="next" id="next" value="/mining">
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Continue</button>
  </form>
  <script>
    document.getElementById("next").value = location.pathname;
    var error = new URLSearchParams(location.search).get("error");
    if (error) {
      var box = document.getElementById("error");
      box.textContent = error === "wait" ? "Too many tries. Wait a few minutes and try again." : "That password isn't right.";
      box.classList.add("show");
    }
  </script>
</body>
</html>
