<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cael's Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    .search-bar {
      width: 100%;
    }
    .search-bar form {
      display: flex;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      overflow: hidden;
      transition: background 0.2s;
    }
    .search-bar form:focus-within {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .search-bar input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      padding: 12px 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    .search-bar input::placeholder { color: rgba(255, 255, 255, 0.4); }
    .search-bar select {
      background: none;
      border: none;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      padding: 0 14px;
      cursor: pointer;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-appearance: none;
      appearance: none;
    }
    .search-bar select option { background: #1a1a2e; color: #fff; }

    /* Right side panel */
    .side-panel {
      position: fixed;
      right: 32px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      text-align: right;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px 32px;
    }

    .clock {
      font-size: 64px;
      font-weight: 200;
      letter-spacing: -3px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .date {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      font-weight: 400;
    }
    .holiday {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 6px;
      line-height: 1.5;
    }
    .holiday-name { color: rgba(255, 255, 255, 0.6); }
    .holiday:empty { display: none; }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 20px 0;
    }

    .weather-temp {
      font-size: 40px;
      font-weight: 300;
      line-height: 1;
    }
    .weather-temp span {
      font-size: 20px;
      color: rgba(255, 255, 255, 0.4);
      vertical-align: top;
    }
    .weather-desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }
    .weather-details {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 8px;
      line-height: 1.6;
    }
    .daylight {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 6px;
      line-height: 1.5;
    }
    .daylight-value { color: rgba(255, 255, 255, 0.6); }
    .daylight:empty { display: none; }

    /* Spotify */
    .spotify {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .spotify:hover { opacity: 0.8; }
    .spotify-art {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .spotify-info { text-align: right; min-width: 0; }
    .spotify-track {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .spotify-artist {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
      margin-top: 1px;
    }
    .spotify-label {
      font-size: 10px;
      color: #1db954;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .spotify-hidden { display: none; }

    .top-section {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      width: 90%;
      max-width: 560px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 1px;
    }
    .wotd {
      margin-top: 12px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 400;
      max-width: 520px;
      line-height: 1.5;
      margin-left: auto;
      margin-right: auto;
    }
    .wotd-word {
      color: rgba(255, 255, 255, 0.85);
      font-style: italic;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 0.5px;
    }
    .wotd-pos {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      font-style: italic;
    }
    .wotd-def {
      display: block;
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
    }
    .top-search {
      margin-top: 16px;
    }
    .top-links {
      margin-top: 14px;
      font-size: 13px;
    }
    .top-links a {
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }
    .top-links a:hover { color: rgba(255, 255, 255, 0.85); }
    .top-links .sep {
      color: rgba(255, 255, 255, 0.2);
      margin: 0 10px;
    }

    img.bg {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Deploy timestamp (desktop only) */
    .last-updated {
      position: fixed;
      top: 20px;
      left: 24px;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .last-updated:empty { display: none; }

    @media (max-width: 640px) {
      .side-panel {
        right: auto;
        left: 50%;
        top: auto;
        bottom: 16px;
        transform: translateX(-50%);
        text-align: center;
        padding: 14px 20px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .clock { font-size: 24px; letter-spacing: -1px; }
      .date { font-size: 11px; margin-top: 2px; }
      .holiday { display: none; }
      .divider {
        width: 1px;
        height: 32px;
        margin: 0;
      }
      .weather-temp { font-size: 22px; }
      .weather-temp span { font-size: 12px; }
      .weather-desc { font-size: 11px; margin-top: 2px; }
      .weather-details { display: none; }
      .daylight { display: none; }
      .spotify-section .divider { display: none; }
      .spotify-section { margin: 0; }
      .spotify-label { display: none; }
      .spotify { gap: 8px; }
      .spotify-art { width: 32px; height: 32px; border-radius: 4px; }
      .spotify-track { font-size: 11px; max-width: 100px; }
      .spotify-artist { font-size: 10px; max-width: 100px; }
      .spotify-info { text-align: center; }
      .top-section { top: 12px; }
      .page-title { font-size: 20px; }
      .wotd { margin-top: 8px; }
      .wotd-word { font-size: 14px; }
      .wotd-def { font-size: 11px; }
      .top-search { margin-top: 10px; }
      .search-bar input { font-size: 14px; padding: 10px 16px; }
      .last-updated { display: none; }
    }
  </style>
</head>
<body>
  <div class="last-updated" id="lastUpdated" data-updated="__LAST_UPDATED__"></div>

  <div class="top-section">
    <div class="page-title">Cael's Page</div>
    <div class="wotd" id="wotd"></div>
    <div class="top-search">
      <div class="search-bar">
        <form id="searchForm" action="https://www.google.com/search" method="GET">
          <input type="text" id="searchInput" name="q" placeholder="Search Google..." autocomplete="off" autofocus>
          <select id="searchEngine">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="yandex">Yandex</option>
          </select>
        </form>
      </div>
    </div>
    <div class="top-links">
      <a href="/minesweeper">Minesweeper</a>
      <span class="sep">&middot;</span>
      <a href="https://github.com/babylettuce22" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>

  <div class="side-panel">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
    <div class="holiday" id="holiday"></div>
    <div class="divider"></div>
    <div class="weather-temp" id="weatherTemp">--<span>&deg;</span></div>
    <div class="weather-desc" id="weatherDesc">loading...</div>
    <div class="weather-details" id="weatherDetails"></div>
    <div class="daylight" id="daylight"></div>
    <div class="spotify-section spotify-hidden" id="spotifySection">
      <div class="divider"></div>
      <div class="spotify-label" id="spotifyLabel">Last played</div>
      <a class="spotify" id="spotifyLink" href="#" target="_blank" rel="noopener">
        <div class="spotify-info">
          <div class="spotify-track" id="spotifyTrack"></div>
          <div class="spotify-artist" id="spotifyArtist"></div>
        </div>
        <img class="spotify-art" id="spotifyArt" src="" alt="">
      </a>
    </div>
  </div>

  <img class="bg" src="/happy.gif" alt="">

  <script>
    var engines = {
      google: { action: "https://www.google.com/search", param: "q", name: "Google" },
      bing: { action: "https://www.bing.com/search", param: "q", name: "Bing" },
      yandex: { action: "https://yandex.com/search/", param: "text", name: "Yandex" }
    };

    var searchSelect = document.getElementById("searchEngine");
    var searchForm = document.getElementById("searchForm");
    var searchInput = document.getElementById("searchInput");

    searchInput.focus();

    var saved = localStorage.getItem("searchEngine");
    if (saved && engines[saved]) searchSelect.value = saved;
    setEngine(searchSelect.value);

    searchSelect.addEventListener("change", function() {
      setEngine(this.value);
      localStorage.setItem("searchEngine", this.value);
    });

    function setEngine(key) {
      var e = engines[key];
      searchForm.action = e.action;
      searchInput.name = e.param;
      searchInput.placeholder = "Search " + e.name + "...";
    }

    function updateClock() {
      var now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      document.getElementById("date").textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    }
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(showDaylight, 1000);

    function showLastUpdated() {
      var el = document.getElementById("lastUpdated");
      var raw = el.getAttribute("data-updated");
      if (!raw || raw.charAt(0) === "_") return;
      var d = new Date(raw);
      if (isNaN(d.getTime())) return;
      el.textContent = "Page last updated: " + d.toLocaleString([], {
        month: "short", day: "numeric", year: "numeric",
        hour: "numeric", minute: "2-digit"
      });
    }
    showLastUpdated();

    // Holidays are computed locally rather than fetched, so there's no API
    // to depend on and no key to rotate. Month args are 0-indexed.
    function nthWeekdayOfMonth(y, month, weekday, n) {
      var first = new Date(y, month, 1);
      var offset = (weekday - first.getDay() + 7) % 7;
      return new Date(y, month, 1 + offset + (n - 1) * 7);
    }

    function lastWeekdayOfMonth(y, month, weekday) {
      var last = new Date(y, month + 1, 0);
      var offset = (last.getDay() - weekday + 7) % 7;
      return new Date(y, month, last.getDate() - offset);
    }

    // Anonymous Gregorian computus.
    function easter(y) {
      var a = y % 19, b = Math.floor(y / 100), c = y % 100;
      var d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      var g = Math.floor((b - f + 1) / 3);
      var hh = (19 * a + b - d - g + 15) % 30;
      var i = Math.floor(c / 4), k = c % 4;
      var l = (32 + 2 * e + 2 * i - hh - k) % 7;
      var m = Math.floor((a + 11 * hh + 22 * l) / 451);
      var month = Math.floor((hh + l - 7 * m + 114) / 31);
      var day = ((hh + l - 7 * m + 114) % 31) + 1;
      return new Date(y, month - 1, day);
    }

    function holidaysFor(y) {
      return [
        { name: "New Year's Day", date: new Date(y, 0, 1) },
        { name: "MLK Day", date: nthWeekdayOfMonth(y, 0, 1, 3) },
        { name: "Valentine's Day", date: new Date(y, 1, 14) },
        { name: "Presidents' Day", date: nthWeekdayOfMonth(y, 1, 1, 3) },
        { name: "St. Patrick's Day", date: new Date(y, 2, 17) },
        { name: "Easter", date: easter(y) },
        { name: "Mother's Day", date: nthWeekdayOfMonth(y, 4, 0, 2) },
        { name: "Memorial Day", date: lastWeekdayOfMonth(y, 4, 1) },
        { name: "Father's Day", date: nthWeekdayOfMonth(y, 5, 0, 3) },
        { name: "Juneteenth", date: new Date(y, 5, 19) },
        { name: "Independence Day", date: new Date(y, 6, 4) },
        { name: "Labor Day", date: nthWeekdayOfMonth(y, 8, 1, 1) },
        { name: "Halloween", date: new Date(y, 9, 31) },
        { name: "Veterans Day", date: new Date(y, 10, 11) },
        { name: "Thanksgiving", date: nthWeekdayOfMonth(y, 10, 4, 4) },
        { name: "Christmas", date: new Date(y, 11, 25) },
        { name: "New Year's Eve", date: new Date(y, 11, 31) }
      ];
    }

    function nextHoliday() {
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var list = holidaysFor(today.getFullYear()).concat(holidaysFor(today.getFullYear() + 1));
      list.sort(function (a, b) { return a.date - b.date; });
      for (var i = 0; i < list.length; i++) {
        if (list[i].date >= today) {
          return { name: list[i].name, days: Math.round((list[i].date - today) / 86400000) };
        }
      }
      return null;
    }

    function showHoliday() {
      var next = nextHoliday();
      if (!next) return;
      var when = next.days === 0 ? "today" : next.days === 1 ? "tomorrow" : "in " + next.days + " days";
      document.getElementById("holiday").innerHTML =
        '<span class="holiday-name">' + next.name + '</span> &middot; ' + when;
    }
    showHoliday();
    setInterval(showHoliday, 60 * 60 * 1000);

    function loadWotd() {
      fetch("/api/wotd")
        .then(function(res) { return res.json(); })
        .then(function(w) {
          if (w.error) return;
          var html = '<span class="wotd-word">' + w.word + '</span>';
          if (w.partOfSpeech) html += ' <span class="wotd-pos">' + w.partOfSpeech + '</span>';
          if (w.definition) html += '<span class="wotd-def">' + w.definition + '</span>';
          document.getElementById("wotd").innerHTML = html;
        })
        .catch(function() {});
    }
    loadWotd();

    // Last weather payload, kept so the daylight countdown can retick every
    // second off the clock without refetching.
    var lastWeather = null;

    // wttr.in reports astronomy in the location's local time ("07:49 PM").
    function parseClockTime(str, dayOffset) {
      var m = /^([0-9]{1,2}):([0-9]{2}) *(AM|PM)$/i.exec(String(str || "").trim());
      if (!m) return null;
      var hour = parseInt(m[1], 10) % 12;
      if (/pm/i.test(m[3])) hour += 12;
      var d = new Date();
      d.setDate(d.getDate() + (dayOffset || 0));
      d.setHours(hour, parseInt(m[2], 10), 0, 0);
      return d;
    }

    function formatDuration(ms) {
      var mins = Math.max(0, Math.round(ms / 60000));
      var hrs = Math.floor(mins / 60);
      return hrs > 0 ? hrs + "h " + (mins % 60) + "m" : mins + "m";
    }

    function formatClock(d) {
      return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }

    function showDaylight() {
      var el = document.getElementById("daylight");
      if (!lastWeather) return;
      var sunrise = parseClockTime(lastWeather.sunrise, 0);
      var sunset = parseClockTime(lastWeather.sunset, 0);
      if (!sunrise || !sunset) return;
      var now = new Date();
      var html;
      if (now < sunrise) {
        html = "Sunrise " + formatClock(sunrise) + " &middot; in " +
          formatDuration(sunrise - now);
      } else if (now < sunset) {
        html = "Sunset " + formatClock(sunset) + " &middot; <span class=\"daylight-value\">" +
          formatDuration(sunset - now) + "</span> of light left";
      } else {
        // After dark, point at tomorrow. Sunrise shifts by a minute or two a
        // day, which is well inside the resolution we display.
        var next = parseClockTime(lastWeather.sunrise, 1);
        html = "Sunrise " + formatClock(next) + " &middot; in " + formatDuration(next - now);
      }
      el.innerHTML = html;
    }

    function uvBand(uv) {
      if (uv >= 11) return "Extreme";
      if (uv >= 8) return "Very high";
      if (uv >= 6) return "High";
      if (uv >= 3) return "Moderate";
      return "Low";
    }

    function loadWeather() {
      fetch("/api/weather")
        .then(function(res) { return res.json(); })
        .then(function(w) {
          if (w.error) return;
          document.getElementById("weatherTemp").innerHTML = w.temp_f + '<span>&deg;F</span>';
          document.getElementById("weatherDesc").textContent = w.desc;
          var details =
            "Feels like " + w.feels_like_f + "&deg; &middot; " +
            w.humidity + "% humidity &middot; " +
            w.wind_mph + " mph wind";
          var uv = parseInt(w.uv_index, 10);
          if (!isNaN(uv)) details += "<br>UV " + uv + " &middot; " + uvBand(uv);
          document.getElementById("weatherDetails").innerHTML = details;
          lastWeather = w;
          showDaylight();
        })
        .catch(function() {
          document.getElementById("weatherDesc").textContent = "unavailable";
        });
    }
    loadWeather();
    setInterval(loadWeather, 10 * 60 * 1000);

    function loadSpotify() {
      fetch("/api/recently-played")
        .then(function(res) { return res.json(); })
        .then(function(s) {
          if (s.error) return;
          document.getElementById("spotifySection").classList.remove("spotify-hidden");
          document.getElementById("spotifyTrack").textContent = s.name;
          document.getElementById("spotifyArtist").textContent = s.artist;
          document.getElementById("spotifyLink").href = s.url;
          document.getElementById("spotifyLabel").textContent = s.is_playing ? "Now playing" : "Last played";
          if (s.image) document.getElementById("spotifyArt").src = s.image;
        })
        .catch(function() {});
    }
    loadSpotify();
    setInterval(loadSpotify, 60 * 1000);
  </script>
</body>
</html>
